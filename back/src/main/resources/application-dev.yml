spring:
  datasource:
    # back 디렉터리 기준 db_dev.mv.db 파일에 남는다.
    url: jdbc:h2:./db_dev
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:5173

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
